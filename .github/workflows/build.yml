name: Flutter APK Build

on:
  push:
    branches: [ main, master, ana ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'

    - name: Re-create Android Platform Files
      run: flutter create . --project-name=dostyeri_app --platforms=android

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dostyeri-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        
